# Installed by the cedar-server .deb.
#
# A drop-in for the Cedar image's own cedar.service: it swaps ExecStart to the
# packaged /usr/bin/cedar-box-server and changes nothing else. User,
# WorkingDirectory (/home/cedar/run) and unit ordering still come from the
# image, and the server's relative default paths (the Cedar Aim web app, the
# tetra3 script, preferences, logs) resolve against that working directory
# exactly as before. Removing the package removes this file, and the service
# falls back to the image's /home/cedar/cedar/bin/cedar-box-server.
#
# Local changes go in /etc/systemd/system/cedar.service.d/, which overrides
# this file. Environment variables the server understands (CEDAR_SOLVER, ...)
# can be set in /etc/default/cedar-server without touching any unit file.

[Service]
EnvironmentFile=-/etc/default/cedar-server
ExecStart=
# The venv is only needed by the Python tetra3 solver; it is activated when it
# exists so that the package also works on a box without it. No shell variables
# here on purpose: systemd would expand them itself.
ExecStart=/bin/bash -c 'if [ -f /home/cedar/cedar/cedar-solve/.cedar_venv/bin/activate ]; then . /home/cedar/cedar/cedar-solve/.cedar_venv/bin/activate; fi; exec /usr/bin/cedar-box-server'
